name: Release

# Actions are pinned by commit SHA with the tag in a trailing comment, and the
# runner is pinned explicitly. See .github/workflows/ci.yml for the rationale.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# The Kandev SDK the plugin is built against: the standard target, the newest
# Kandev release this plugin is verified on. It is a tag, not HEAD — an unpinned
# SDK breaks the build whenever upstream moves a dependency. Move it when a new
# Kandev ships, and keep it in step across the workflows in this directory.
env:
  KANDEV_REF: v0.97.0

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kandev-plugin-forgejo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kdlbs/kandev
          ref: ${{ env.KANDEV_REF }}
          path: kandev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # An exact patch release, not "1.26": the runner image caches an older
          # one, and stdlib fixes (net/http, crypto/tls) ship in patch releases.
          # The release workflow builds the binary operators run. Keep every pin
          # in step; bump it when govulncheck reports a newer fix.
          go-version: "1.26.9"
          cache-dependency-path: kandev-plugin-forgejo/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install UI dependencies
        working-directory: kandev-plugin-forgejo
        run: npm install --no-audit --no-fund

      # The tag must match manifest.yaml's version, or the marketplace entry
      # resolves to an asset name nobody can predict.
      - name: Check tag matches manifest version
        working-directory: kandev-plugin-forgejo
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -E '^version:' manifest.yaml | head -1 | cut -d'"' -f2)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match manifest version $manifest"
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_ENV"

      - name: Test
        working-directory: kandev-plugin-forgejo
        run: |
          go test ./... -count=1
          npm test

      - name: Package all platforms
        working-directory: kandev-plugin-forgejo
        run: make verify-package

      # The release page shows this version's CHANGELOG section, so the notes
      # are written once, in the changelog. An empty section fails the release
      # rather than publishing a blank page.
      - name: Extract release notes
        working-directory: kandev-plugin-forgejo
        run: |
          set -euo pipefail
          awk -v v="$version" '$0 ~ "^## " v "$" {f=1; next} /^## /{f=0} f' CHANGELOG.md \
            | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
        env:
          version: ${{ env.version }}

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: kandev-plugin-forgejo/kandev-plugin-forgejo-${{ env.version }}.tar.gz
          body_path: ${{ runner.temp }}/notes.md
          # A version with a hyphen (0.4.0-rc.1) is a pre-release.
          prerelease: ${{ contains(env.version, '-') }}
