name: CI

# Actions are pinned by commit SHA with the tag in a trailing comment: a tag can
# be moved, a SHA cannot, and this is third-party code with access to the build.
# The runner is pinned too — `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19,
# and a runner change should be a commit that CI votes on, not a date that passes.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: every job here only reads the repository.
permissions:
  contents: read

# The Kandev SDK the plugin is built against: the standard target, the newest
# Kandev release this plugin is verified on. It is a tag, not HEAD — an unpinned
# SDK breaks the build whenever upstream moves a dependency. Move it when a new
# Kandev ships, and keep it in step across the workflows in this directory.
env:
  KANDEV_REF: v0.97.0
  # The oldest Kandev the manifest claims (min_kandev_version). The test job
  # also builds against it, so an API newer than that cannot slip in unnoticed.
  KANDEV_MIN_REF: v0.95.1

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # standard = KANDEV_REF, minimum = KANDEV_MIN_REF.
        target: [standard, minimum]
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kandev-plugin-forgejo

      # The SDK is not a standalone module yet, so the build needs a sibling
      # kandev checkout (see docs/development.md).
      - name: Check out kandev SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kdlbs/kandev
          ref: ${{ matrix.target == 'minimum' && env.KANDEV_MIN_REF || env.KANDEV_REF }}
          path: kandev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # An exact patch release, not "1.26": the runner image caches an older
          # one, and stdlib fixes (net/http, crypto/tls) ship in patch releases.
          # The release workflow builds the binary operators run. Keep every pin
          # in step; bump it when govulncheck reports a newer fix.
          go-version: "1.26.9"
          cache-dependency-path: kandev-plugin-forgejo/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install UI dependencies
        working-directory: kandev-plugin-forgejo
        run: npm install --no-audit --no-fund

      - name: gofmt
        working-directory: kandev-plugin-forgejo
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for: $unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: kandev-plugin-forgejo
        run: go vet ${{ matrix.target == 'minimum' && '-tags kandev_min' || '' }} ./...

      - name: Typecheck UI
        working-directory: kandev-plugin-forgejo
        run: npm run typecheck

      - name: Go tests
        working-directory: kandev-plugin-forgejo
        run: go test ${{ matrix.target == 'minimum' && '-tags kandev_min' || '' }} ./... -count=1

      - name: UI tests
        working-directory: kandev-plugin-forgejo
        run: npm test

      - name: Verify package
        working-directory: kandev-plugin-forgejo
        run: make verify-package

  # The live contract tests run against real instances of both hosts, at the
  # floor and the current release of each.
  live:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor and the current release of each host. The floor entries
          # are the versions README.md's supported range promises.
          - flavor: gitea
            binary: gitea
            image: gitea/gitea:1.20
          - flavor: gitea
            binary: gitea
            image: gitea/gitea:1.27
          - flavor: forgejo
            binary: forgejo
            image: codeberg.org/forgejo/forgejo:7
          - flavor: forgejo
            binary: forgejo
            image: codeberg.org/forgejo/forgejo:16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kandev-plugin-forgejo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kdlbs/kandev
          ref: ${{ env.KANDEV_REF }}
          path: kandev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # An exact patch release, not "1.26": the runner image caches an older
          # one, and stdlib fixes (net/http, crypto/tls) ship in patch releases.
          # The release workflow builds the binary operators run. Keep every pin
          # in step; bump it when govulncheck reports a newer fix.
          go-version: "1.26.9"
          cache-dependency-path: kandev-plugin-forgejo/go.sum

      - name: Start ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          PREFIX: ${{ matrix.flavor == 'forgejo' && 'FORGEJO' || 'GITEA' }}
        run: |
          docker run -d --name instance -p 3000:3000 \
            -e ${PREFIX}__security__INSTALL_LOCK=true \
            -e ${PREFIX}__database__DB_TYPE=sqlite3 \
            -e ${PREFIX}__server__ROOT_URL=http://localhost:3000/ \
            -e SSH_PORT=2222 -e SSH_LISTEN_PORT=2222 \
            "$IMAGE"
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/v1/version >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/v1/version

      - name: Seed instance
        id: seed
        env:
          BINARY: ${{ matrix.binary }}
          ADMIN_PASSWORD: ${{ github.run_id }}-seed-Aa1!
        run: |
          set -euo pipefail
          docker exec -u git -e ADMIN_PASSWORD="$ADMIN_PASSWORD" instance "$BINARY" admin user create \
            --admin --username kandev --password "$ADMIN_PASSWORD" \
            --email kandev@example.com --must-change-password=false
          # Mint through the admin CLI rather than HTTP basic auth: no
          # credential pair ever appears in a command line, and the CLI's
          # 'all' scope is the one spelling that works across every supported
          # version (the 1.20+ scope names do not exist on older hosts).
          token="$(docker exec -u git instance "$BINARY" admin user generate-access-token \
            --username kandev --token-name ci --scopes 'all' --raw | tr -d '\r\n')"
          echo "::add-mask::$token"
          auth="Authorization: token $token"
          curl -sf -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d '{"name":"demo","auto_init":true,"default_branch":"main"}' \
            http://localhost:3000/api/v1/user/repos > /dev/null
          content="$(printf 'hello' | base64 -w0)"
          for pair in "feature/kandev-demo:demo.txt" "feature/kandev-create:create.txt"; do
            branch="${pair%%:*}"; file="${pair##*:}"
            curl -sf -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"content\":\"$content\",\"message\":\"seed\",\"new_branch\":\"$branch\"}" \
              "http://localhost:3000/api/v1/repos/kandev/demo/contents/$file" > /dev/null
          done
          curl -sf -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d '{"head":"feature/kandev-demo","base":"main","title":"Seed pull request"}' \
            http://localhost:3000/api/v1/repos/kandev/demo/pulls > /dev/null
          # Two more accounts for the multi-user cases: `reviewer` can write
          # (review, request, merge) and `readonly` can only read. Neither is
          # an admin, so they see what an ordinary token sees.
          for pair in "reviewer:write" "readonly:read"; do
            user="${pair%%:*}"; permission="${pair##*:}"
            docker exec -u git -e ADMIN_PASSWORD="$ADMIN_PASSWORD" instance "$BINARY" admin user create \
              --username "$user" --password "$ADMIN_PASSWORD" \
              --email "$user@example.com" --must-change-password=false
            user_token="$(docker exec -u git instance "$BINARY" admin user generate-access-token \
              --username "$user" --token-name ci --scopes 'all' --raw | tr -d '\r\n')"
            echo "::add-mask::$user_token"
            echo "${user}_token=$user_token" >> "$GITHUB_OUTPUT"
            curl -sf -X PUT -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"permission\":\"$permission\"}" \
              "http://localhost:3000/api/v1/repos/kandev/demo/collaborators/$user" > /dev/null
          done
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Live contract tests
        working-directory: kandev-plugin-forgejo
        env:
          KANDEV_FORGEJO_URL: http://localhost:3000
          KANDEV_FORGEJO_TOKEN: ${{ steps.seed.outputs.token }}
          KANDEV_FORGEJO_OWNER: kandev
          KANDEV_FORGEJO_REPO: demo
          KANDEV_FORGEJO_HEAD_BRANCH: feature/kandev-create
          KANDEV_FORGEJO_REVIEWER: reviewer
          KANDEV_FORGEJO_REVIEWER_TOKEN: ${{ steps.seed.outputs.reviewer_token }}
          KANDEV_FORGEJO_READONLY_TOKEN: ${{ steps.seed.outputs.readonly_token }}
          KANDEV_FORGEJO_EXPECT_FLAVOR: ${{ matrix.flavor }}
        run: go test ./internal/forgejo -run TestLive -v -count=1
