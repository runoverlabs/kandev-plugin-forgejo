# Kandev plugin manifest — the declarative contract between this plugin and a
# Kandev host. `id` matches the Go module name, the id passed to
# window.registerKandevPlugin(...) in ui/bundle.js, and the plugin-registry
# catalog entry. Keep all four in sync when renaming.
id: "kandev-plugin-forgejo"
api_version: 1
version: "0.4.0"
display_name: "Forgejo"
description: "Connect a self-hosted Forgejo or Gitea instance to native Kandev repository, pull-request, task-link, and review workflows."
author: "naerymdan"
categories: ["connector"]
repo_url: "https://github.com/naerymdan/kandev-plugin-forgejo"
icon: "assets/icon.svg"

# The source-control contracts this plugin started on shipped in v0.88.0, but
# `agent_tools` below needs a host that serves plugin tools over Kandev's MCP
# endpoint. An older host ignores the block silently rather than refusing the
# install, which would leave the tools missing with nothing said — so the floor
# is raised instead.
min_kandev_version: "0.95.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# Least privilege. `tasks`/`repositories` back the attached-repository resolver
# used by verified PR creation; `state` backs the task<->pull-request
# association store and the issue-watch configuration and dedup ledger.
#
# `workspaces`, `workflows`, `agent_profiles` and `executor_profiles` exist for
# issue watches only: the poller enumerates workspaces to find due watches, and
# the configuration form cannot let an operator choose where a created task
# lands without reading the workflows, steps and profiles by name.
#
# `api_write: tasks` is the capability that lets a watch put a card on the
# board. It is the one real privilege escalation in this manifest — capability
# grants are permission gates, not a sandbox — and it is scoped to task
# creation because Kandev owns every other entity mutation here. Kandev stamps
# `source = "plugin:kandev-plugin-forgejo"` on the rows this plugin creates and
# the plugin cannot set that itself, so a task from a watch is permanently
# attributable.
#
# Review watches add no capability. They also use `api_write: tasks` to end the
# life of a task whose pull request has finished: `Tasks().Update` to mark it
# complete, and, where the host allows it (`host.v2.write:tasks`, which Kandev
# 0.97.0 approves together with `api_write`), the exact archive command. A plugin
# cannot delete tasks.
#
# Pull request automation (docs/pr-automation.md) adds three, and changing the
# set means the operator re-approves every capability after upgrading:
# - `api_write: messages`: prompting a task's agent (auto-fix, lifecycle
#   prompts) is only possible through Messages().Send; Kandev's own automation
#   has no extension point for other providers.
# - `api_read: sessions`: Send starts a never-launched session, so the plugin
#   reads session states first. A fork's task is never started that way, and
#   an auto-fix turn that ended without reporting is noticed.
# - `events`: turn and session changes are pushed so the loop reacts at once.
#   They are hints; the poll is the source of truth when one is lost.
capabilities:
  api_read: ["tasks", "repositories", "workspaces", "workflows", "agent_profiles", "executor_profiles", "sessions"]
  api_write: ["tasks", "messages"]
  events: ["turn.completed", "task_session.state_changed"]
  state: true
  secrets: true

# Browser bodies are untrusted and bounded. Kandev authorizes each selector and
# passes it separately as VerifiedActionContext.
actions:
  - key: "connection.get"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "connection.test"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "connection.set_enabled"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "connection.set_agent_merge"
    scope: "workspace"
    max_body_bytes: 1024
  # The recent pull request writes in this workspace and who made them: the
  # shared Forgejo account hides that on the Forgejo side.
  - key: "connection.audit"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "repositories.list"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "repositories.inspect"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "repositories.branches"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "change_requests.create"
    scope: "task"
    max_body_bytes: 65536
  - key: "change_requests.get"
    scope: "task"
    max_body_bytes: 1024
  # The review panel's one read: pull request, merge options and blockers,
  # reviews and comments, bounded to fit the host's 15 s / 1 MiB limits. Body
  # is at most {"number": N}; the pull request must already be linked to the
  # verified task.
  - key: "change_requests.details"
    scope: "task"
    max_body_bytes: 1024
  # Writes on a pull request the verified task has linked. Each acts as the
  # operator's shared Forgejo account, carries the head SHA the caller last saw
  # (merge requires it), and has its own key so the Kandev action audit shows
  # which write happened. Bodies are bounded to what the action can use.
  - key: "change_requests.merge"
    scope: "task"
    max_body_bytes: 4096
  - key: "change_requests.review"
    scope: "task"
    max_body_bytes: 65536
  - key: "change_requests.request_reviewers"
    scope: "task"
    max_body_bytes: 2048
  - key: "change_requests.update_branch"
    scope: "task"
    max_body_bytes: 1024
  - key: "change_requests.comment"
    scope: "task"
    max_body_bytes: 16384
  - key: "change_requests.link"
    scope: "task"
    max_body_bytes: 16384
  - key: "change_requests.unlink"
    scope: "task"
    max_body_bytes: 4096
  - key: "change_requests.associations"
    scope: "workspace"
    max_body_bytes: 1024

  # Issue watches. Every one is workspace-scoped: PR #3681 fixed a real leak
  # where native providers returned every workspace's watch configs, exposing
  # filters, repository/agent/profile ids and spawn prompts. Kandev verifies
  # the workspace before the handler runs and the handler never reads one from
  # the body, so that class of bug cannot start here.
  - key: "watches.list"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "watches.options"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "watches.create"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "watches.update"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "watches.delete"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "watches.run"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "watches.reset"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "watches.cleanup"
    scope: "workspace"
    max_body_bytes: 1024

  # Pull request automation. The task-scoped three act on a pull request the
  # verified task links ({"number": N} picks among them); the settings are the
  # workspace's. Turning a switch on is a human act: the agent tools cannot.
  - key: "automation.get"
    scope: "task"
    max_body_bytes: 1024
  - key: "automation.set"
    scope: "task"
    max_body_bytes: 1024
  - key: "automation.retry"
    scope: "task"
    max_body_bytes: 1024
  - key: "automation.settings"
    scope: "workspace"
    max_body_bytes: 1024
  # The Host measures the JSON as sent: a 16 KiB template escapes to up to six
  # times that (a control character is \u00XX), so the bound leaves room.
  - key: "automation.settings_set"
    scope: "workspace"
    max_body_bytes: 102400

# Tools exposed to task agents through Kandev's MCP endpoint. Every definition
# here is injected into every agent session on a matching surface and cannot be
# swapped for a built-in, so the set is deliberately small and the descriptions
# and schemas are written to be read once, not browsed. They exist to delete
# hand-written curl recipes from workflow step prompts, which is only a win if
# they cost less than the prose they replace.
agent_tools:
  - name: "ci"
    description: "Forgejo/Gitea CI for a ref in this task's repo: overall state and each job, optionally with the tail of each failed job's log."
    surfaces: ["kanban-task"]
    input_schema:
      type: object
      properties:
        ref:
          type: string
          description: "Branch name or commit SHA."
        logs:
          type: integer
          description: "Tail lines per failed job. Omit for none, max 2000."
        repo:
          type: string
          description: "owner/name; only if the task has several."
      required: ["ref"]
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true

  - name: "pr"
    description: "This task's Forgejo/Gitea PR: get, open, ready (clears WIP:), merge (needs sha; operator-enabled), review, request_review, update, comment, outcome."
    surfaces: ["kanban-task"]
    input_schema:
      type: object
      properties:
        op:
          type: string
          enum: ["get", "open", "ready", "merge", "review", "request_review", "update", "comment", "outcome"]
        head:
          type: string
          description: "Branch to open from."
        base:
          type: string
          description: "Target branch."
        title:
          type: string
        body:
          type: string
          description: "Description, review or comment text."
        draft:
          type: boolean
        sha:
          type: string
          description: "Head commit from get; merge needs it."
        event:
          type: string
          enum: ["approve", "request_changes", "comment"]
        style:
          type: string
          description: "Merge style; merge|rebase for update."
        reviewers:
          type: array
          items:
            type: string
        delete_branch:
          type: boolean
        outcome:
          type: string
        repo:
          type: string
      required: ["op"]
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: true

# Webhook automation conditions (docs/automations.md). The host renders the
# editor, owns each binding's URL and signing secret, and hands the plugin a
# delivery to verify; no capability is involved. Each condition needs its own
# Forgejo webhook. Changing a condition's key, fields or config_version strands
# every trigger saved against it, so treat them as frozen.
#
# An absent boolean is false: the editor renders it off, so the plugin reads it
# the same way. default_config is the only place a default exists
# (internal/automations.Defaults, which manifest_test.go compares).
automation_conditions:
  - key: "push"
    access: "public"
    config_version: 1
    label: "Forgejo push"
    description: "A push to a branch of a Forgejo or Gitea repository. Tag pushes and branch deletions do not fire."
    verification_headers: ["x-forgejo-signature", "x-gitea-signature", "x-hub-signature-256", "x-forgejo-event", "x-gitea-event"]
    config_schema:
      type: object
      additionalProperties: false
      required: ["repository"]
      properties:
        repository: { type: string, title: "Repository (owner/name)" }
        branches: { type: array, items: { type: string }, title: "Branches (globs, one per line; empty for all)" }
    default_config: {}
  - key: "pull_request"
    access: "public"
    config_version: 1
    label: "Forgejo pull request"
    description: "A pull request opened, updated, closed, merged, commented on or given a review request in a Forgejo or Gitea repository."
    verification_headers: ["x-forgejo-signature", "x-gitea-signature", "x-hub-signature-256", "x-forgejo-event", "x-gitea-event"]
    config_schema:
      type: object
      additionalProperties: false
      required: ["repository"]
      properties:
        repository: { type: string, title: "Repository (owner/name)" }
        base_branches: { type: array, items: { type: string }, title: "Base branches (globs; empty for all)" }
        authors: { type: array, items: { type: string }, title: "Authors (logins; empty for all)" }
        labels: { type: array, items: { type: string }, title: "Labels (any of; empty for all)" }
        on_opened: { type: boolean, title: "When opened" }
        on_reopened: { type: boolean, title: "When reopened" }
        on_synchronized: { type: boolean, title: "When new commits are pushed" }
        on_closed: { type: boolean, title: "When closed without merging" }
        on_merged: { type: boolean, title: "When merged" }
        on_review_requested: { type: boolean, title: "When a review is requested" }
        on_commented: { type: boolean, title: "When commented on (Forgejo 11+, Gitea). Warning: anyone who can comment, not only the authors listed above, starts a run and writes text the agent reads." }
        exclude_draft: { type: boolean, title: "Skip drafts" }
        include_forks: { type: boolean, title: "Include pull requests from forks" }
    default_config: { on_opened: true, exclude_draft: true }
  - key: "ci_result"
    access: "public"
    config_version: 1
    label: "Forgejo CI result"
    description: "A Forgejo Actions run finished. Needs Forgejo 12 or later; Gitea is not supported."
    verification_headers: ["x-forgejo-signature", "x-gitea-signature", "x-hub-signature-256", "x-forgejo-event", "x-gitea-event"]
    config_schema:
      type: object
      additionalProperties: false
      required: ["repository"]
      properties:
        repository: { type: string, title: "Repository (owner/name)" }
        branches: { type: array, items: { type: string }, title: "Branches (globs; a pull request run uses its head branch)" }
        workflows: { type: array, items: { type: string }, title: "Workflow files (e.g. ci.yml; empty for all)" }
        on_success: { type: boolean, title: "When the run succeeds" }
        on_failure: { type: boolean, title: "When the run fails" }
        on_cancelled: { type: boolean, title: "When the run is cancelled" }
        include_forks: { type: boolean, title: "Include runs for pull requests from forks" }
    default_config: { on_failure: true }

repository_providers: ["forgejo"]

reference_sources:
  - source: "forgejo_pull_requests"
    provider: "forgejo"
    kind: "pull_request"
    display_name: "Forgejo pull requests"
    kind_label: "Pull request"
    order: 40

ui:
  bundle: "/ui/bundle.js"
  styles: ["/ui/plugin.css"]

config_schema:
  type: object
  required: ["base_url", "api_token"]
  properties:
    base_url:
      type: string
      title: "Instance URL"
      description: "Base URL of the Forgejo or Gitea instance, e.g. https://codeberg.org. The REST v1 API is expected at <base_url>/api/v1."
    api_token:
      type: string
      title: "Access token"
      description: "Personal access token with scopes read:repository, read:user and read:issue, plus write:repository to open pull requests. Stored in Kandev's encrypted vault and readable only inside this plugin process."
      secret: true
